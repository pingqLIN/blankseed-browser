<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>BlankSeed Browser 控制台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="console-head">
      <div>
        <h1>BlankSeed Browser</h1>
        <p>本機研究控制台</p>
      </div>
        <button id="refresh-all" class="icon-btn" title="重新整理" aria-label="重新整理所有面板">↻</button>
    </header>

    <section class="status-grid" aria-label="狀態">
      <div class="status-cell">
        <span>Session 工作階段</span>
        <strong id="stat-session">載入中</strong>
      </div>
      <div class="status-cell">
        <span>Target 目標頁</span>
        <strong id="stat-target">載入中</strong>
      </div>
      <div class="status-cell">
        <span>Node Runtime</span>
        <strong id="stat-runtime">載入中</strong>
      </div>
      <div class="status-cell">
        <span>Module 模組</span>
        <strong id="stat-modules">0 個啟用</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Target 目標頁</h2>
        <div class="toolbar">
        <button id="back" class="icon-btn" title="上一頁" aria-label="上一頁">←</button>
        <button id="forward" class="icon-btn" title="下一頁" aria-label="下一頁">→</button>
        <button id="reload" class="icon-btn" title="重新整理目標頁" aria-label="重新整理目標頁">↻</button>
        </div>
      </div>
      <form id="navigate-form" class="inline-form">
        <input id="url" type="text" autocomplete="off" spellcheck="false" value="https://example.com/" aria-label="目標網址">
        <button type="submit">前往</button>
      </form>
      <div id="target-summary" class="micro-output">等待 Target</div>
    </section>

    <nav class="tabs" aria-label="工作台" role="tablist">
      <button id="tab-button-page" class="tab active" data-tab="page" role="tab" aria-controls="tab-page" aria-selected="true">Page 頁面</button>
      <button id="tab-button-cdp" class="tab" data-tab="cdp" role="tab" aria-controls="tab-cdp" aria-selected="false" tabindex="-1">CDP</button>
      <button id="tab-button-node" class="tab" data-tab="node" role="tab" aria-controls="tab-node" aria-selected="false" tabindex="-1">Node</button>
      <button id="tab-button-module" class="tab" data-tab="module" role="tab" aria-controls="tab-module" aria-selected="false" tabindex="-1">Module 模組</button>
      <button id="tab-button-agent" class="tab" data-tab="agent" role="tab" aria-controls="tab-agent" aria-selected="false" tabindex="-1">Agent</button>
    </nav>

    <section id="tab-page" class="panel tab-panel active" role="tabpanel" aria-labelledby="tab-button-page" tabindex="0">
      <div class="panel-head">
        <h2>Page 基本操作</h2>
        <button id="snapshot">檢查 Snapshot</button>
      </div>
      <textarea id="page-source" spellcheck="false">return {
  title: document.title,
  url: location.href,
  headings: [...document.querySelectorAll('h1,h2')].map((el) => el.textContent)
};</textarea>
      <button id="execute-page">執行 Isolated JS</button>
    </section>

    <section id="tab-agent" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-button-agent" tabindex="0" hidden>
      <div class="panel-head">
        <h2>Agent Runtime 任務</h2>
        <button id="agent-cancel">取消 Agent Run</button>
      </div>
      <label class="field-label" for="agent-task">Task 任務</label>
      <textarea id="agent-task" spellcheck="false">觀察目前 Target，說明頁面內容與可安全執行的下一步。</textarea>
      <div class="agent-grid">
        <label>Model Adapter
          <select id="agent-adapter" aria-label="Model Adapter"></select>
        </label>
        <label>Reasoning effort
          <select id="agent-reasoning" aria-label="Reasoning effort">
            <option value="medium" selected>medium</option>
            <option value="none">none</option>
            <option value="low">low</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </label>
        <label>Max turns
          <input id="agent-max-turns" type="number" min="1" max="24" value="6">
        </label>
        <label>Max actions
          <input id="agent-max-actions" type="number" min="1" max="64" value="12">
        </label>
      </div>
      <button id="agent-run">啟動 Agent Run</button>
      <div id="agent-run-status" class="micro-output" role="status" aria-live="polite">Agent 待命。</div>
    </section>

    <section id="tab-cdp" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-button-cdp" tabindex="0" hidden>
      <div class="panel-head">
        <h2>Raw CDP</h2>
        <button id="send-cdp">傳送</button>
      </div>
      <input id="cdp-method" value="Page.getNavigationHistory" spellcheck="false" aria-label="CDP 方法">
      <textarea id="cdp-params" spellcheck="false" aria-label="CDP 參數（JSON）">{}</textarea>
    </section>

    <section id="tab-node" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-button-node" tabindex="0" hidden>
      <div class="panel-head">
        <h2>Generated Node 執行</h2>
        <div class="toolbar">
          <button id="utility-ping" title="檢查 Node Runtime" aria-label="檢查 Node Runtime">Ping</button>
          <button id="utility-stop">停止</button>
        </div>
      </div>
      <textarea id="utility-source" spellcheck="false">console.log('hello from generated runtime');
return {
  platform: process.platform,
  cwd: process.cwd()
};</textarea>
      <button id="utility-execute">執行 Node Source</button>
    </section>

    <section id="tab-module" class="panel tab-panel" role="tabpanel" aria-labelledby="tab-button-module" tabindex="0" hidden>
      <div class="panel-head">
        <h2>Module 模組庫</h2>
        <button id="module-refresh">重新整理</button>
      </div>
      <div class="module-grid">
        <input id="module-id" value="generated.example" spellcheck="false" aria-label="Module id">
        <input id="module-version" value="0.1.0" spellcheck="false" aria-label="Module 版本">
      </div>
      <input id="module-description" value="生成的 capability" spellcheck="false" aria-label="模組說明">
      <textarea id="module-source" spellcheck="false">return {
  module: environment.name || 'generated.example',
  value: Number(environment.value || 0) + 1
};</textarea>
      <div class="module-grid">
        <input id="module-candidate" placeholder="cand_..." spellcheck="false" aria-label="Candidate 識別碼">
        <input id="module-env" value="{&quot;value&quot;:41}" spellcheck="false" aria-label="Module environment JSON">
      </div>
      <div class="button-grid">
        <button id="module-create">建立 Candidate</button>
        <button id="module-test">測試 Candidate</button>
        <button id="module-commit">Commit 版本</button>
        <button id="module-activate">Activate 版本</button>
        <button id="module-invoke">Invoke Module</button>
        <button id="module-rollback">Rollback 版本</button>
      </div>
      <div id="module-browser" class="browser-list">尚無模組。</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Recovery 復原</h2>
        <div class="toolbar">
          <button id="stop-all">全部停止</button>
          <button id="checkpoint">建立 Checkpoint</button>
          <button id="checkpoint-restore">Restore Checkpoint</button>
        </div>
      </div>
      <input id="checkpoint-label" value="手動 checkpoint" aria-label="Checkpoint label 標籤">
      <input id="checkpoint-id" placeholder="chk_..." spellcheck="false" aria-label="Checkpoint 識別碼">
      <div id="stop-state" class="stop-state idle">
        <span>停止狀態</span>
        <strong>待命</strong>
      </div>
      <div id="checkpoint-browser" class="browser-list compact-list">尚無 Checkpoint。</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Result 結果</h2>
        <button id="clear-result" class="icon-btn" title="清除結果" aria-label="清除結果">×</button>
      </div>
      <pre id="result" class="output">已就緒。</pre>
    </section>

    <section class="panel">
      <div class="panel-head">
      <h2>事件時間軸</h2>
        <button id="refresh-events">重新整理</button>
      </div>
      <div id="timeline" class="timeline">尚無事件。</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
