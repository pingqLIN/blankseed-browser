<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>BlankSeed Browser Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="console-head">
      <div>
        <h1>BlankSeed</h1>
        <p>本機研究控制台</p>
      </div>
      <button id="refresh-all" class="icon-btn" title="重新整理">↻</button>
    </header>

    <section class="status-grid" aria-label="狀態">
      <div class="status-cell">
        <span>Session</span>
        <strong id="stat-session">loading</strong>
      </div>
      <div class="status-cell">
        <span>Target</span>
        <strong id="stat-target">loading</strong>
      </div>
      <div class="status-cell">
        <span>Runtime</span>
        <strong id="stat-runtime">loading</strong>
      </div>
      <div class="status-cell">
        <span>Modules</span>
        <strong id="stat-modules">0 active</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Target</h2>
        <div class="toolbar">
          <button id="back" class="icon-btn" title="上一頁">←</button>
          <button id="forward" class="icon-btn" title="下一頁">→</button>
          <button id="reload" class="icon-btn" title="重新整理目標頁">↻</button>
        </div>
      </div>
      <form id="navigate-form" class="inline-form">
        <input id="url" type="text" autocomplete="off" spellcheck="false" value="https://example.com/" aria-label="目標網址">
        <button type="submit">Go</button>
      </form>
      <div id="target-summary" class="micro-output">waiting for target</div>
    </section>

    <nav class="tabs" aria-label="Workbench">
      <button class="tab active" data-tab="page">Page</button>
      <button class="tab" data-tab="cdp">CDP</button>
      <button class="tab" data-tab="node">Node</button>
      <button class="tab" data-tab="module">Module</button>
    </nav>

    <section id="tab-page" class="panel tab-panel active">
      <div class="panel-head">
        <h2>Page Primitive</h2>
        <button id="snapshot">Inspect</button>
      </div>
      <textarea id="page-source" spellcheck="false">return {
  title: document.title,
  url: location.href,
  headings: [...document.querySelectorAll('h1,h2')].map((el) => el.textContent)
};</textarea>
      <button id="execute-page">Execute Isolated JS</button>
    </section>

    <section id="tab-cdp" class="panel tab-panel">
      <div class="panel-head">
        <h2>Raw CDP</h2>
        <button id="send-cdp">Send</button>
      </div>
      <input id="cdp-method" value="Page.getNavigationHistory" spellcheck="false" aria-label="CDP method">
      <textarea id="cdp-params" spellcheck="false" aria-label="CDP params">{}</textarea>
    </section>

    <section id="tab-node" class="panel tab-panel">
      <div class="panel-head">
        <h2>Generated Node</h2>
        <div class="toolbar">
          <button id="utility-ping">Ping</button>
          <button id="utility-stop">Stop</button>
        </div>
      </div>
      <textarea id="utility-source" spellcheck="false">console.log('hello from generated runtime');
return {
  platform: process.platform,
  cwd: process.cwd()
};</textarea>
      <button id="utility-execute">Execute Node Source</button>
    </section>

    <section id="tab-module" class="panel tab-panel">
      <div class="panel-head">
        <h2>Module Store</h2>
        <button id="module-refresh">Refresh</button>
      </div>
      <div class="module-grid">
        <input id="module-id" value="generated.example" spellcheck="false" aria-label="Module id">
        <input id="module-version" value="0.1.0" spellcheck="false" aria-label="Module version">
      </div>
      <input id="module-description" value="Generated capability" spellcheck="false" aria-label="Module description">
      <textarea id="module-source" spellcheck="false">return {
  module: environment.name || 'generated.example',
  value: Number(environment.value || 0) + 1
};</textarea>
      <div class="module-grid">
        <input id="module-candidate" placeholder="cand_..." spellcheck="false" aria-label="Candidate id">
        <input id="module-env" value="{&quot;value&quot;:41}" spellcheck="false" aria-label="Module environment JSON">
      </div>
      <div class="button-grid">
        <button id="module-create">Candidate</button>
        <button id="module-test">Test</button>
        <button id="module-commit">Commit</button>
        <button id="module-activate">Activate</button>
        <button id="module-invoke">Invoke</button>
        <button id="module-rollback">Rollback</button>
      </div>
      <div id="module-browser" class="browser-list">No modules.</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Recovery</h2>
        <div class="toolbar">
          <button id="stop-all">Stop All</button>
          <button id="checkpoint">Checkpoint</button>
        </div>
      </div>
      <input id="checkpoint-label" value="manual checkpoint" aria-label="Checkpoint label">
      <div id="stop-state" class="stop-state idle">
        <span>stop</span>
        <strong>idle</strong>
      </div>
      <div id="checkpoint-browser" class="browser-list compact-list">No checkpoints.</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Result</h2>
        <button id="clear-result" class="icon-btn" title="清除結果">×</button>
      </div>
      <pre id="result" class="output">Ready.</pre>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Timeline</h2>
        <button id="refresh-events">Refresh</button>
      </div>
      <div id="timeline" class="timeline">No events.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
