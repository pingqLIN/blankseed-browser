name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify syntax, documentation, and unit behavior
        run: npm run verify
